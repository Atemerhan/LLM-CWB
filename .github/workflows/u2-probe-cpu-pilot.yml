name: U2 Probe CPU Pilot

# Plan-B cheap pilot: ONE CPU job runs the FULL u2_probe.py pipeline (extract
# activations -> out-of-fold probe -> B_input/B_behav -> pre-registered §5
# verdict) on a small subset. Validates the probe + verdict code on real
# activations and yields a preliminary observability result, without the
# 30-shard CI-minute blowup. The clean n=300 x 2-model run is the GPU path
# (colab_u2.md). Writes results/<slug>_u2.json (new path; v0 untouched).
# Parameterized so the same workflow can pilot either panel model.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id"
        default: "Qwen/Qwen2.5-3B-Instruct"
      slug:
        description: "output slug -> results/<slug>_u2.json"
        default: "qwen_cpu_pilot"
      per_difficulty:
        description: "subset size per difficulty (20 -> n=60)"
        default: "20"

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch + transformers + scikit-learn
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "transformers>=4.45" scikit-learn numpy
      - name: U2 pilot (full pipeline, CPU)
        run: |
          python u2_probe.py --model "${{ inputs.model }}" --slug "${{ inputs.slug }}" \
            --device cpu --per-difficulty ${{ inputs.per_difficulty }} --max-new-tokens 24
      - name: Upload pilot result
        uses: actions/upload-artifact@v4
        with:
          name: u2-cpu-pilot-${{ inputs.slug }}
          path: results/${{ inputs.slug }}_u2.json
