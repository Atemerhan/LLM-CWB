name: DeepSeek Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DeepSeek benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ secrets.DEEPSEEK_MODEL }}" ]; then
            export DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL }}"
          fi
          python evaluate.py --agent deepseek --output results/deepseek.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-results
          path: results/deepseek.json
