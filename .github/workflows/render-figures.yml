name: Render Figures

# Renders the thesis figures from the committed result JSON (read-only) using
# make_figures.py. No secrets, no API, no benchmark code touched. Uploads the
# figures as an artifact for ingestion. Manual dispatch only.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install matplotlib
        run: pip install matplotlib
      - name: Render figures
        run: python make_figures.py --outdir figures
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: thesis-figures
          path: figures/
